[pytest]
testpaths = part1_api_automation/tests part2_performance/tests part3_e2e/tests
addopts = -q --tb=short --strict-markers --alluredir=allure-results
markers =
    read_only: 데이터를 변경하지 않는 조회 테스트
    mutating: POST, PATCH, DELETE 상태 변경 테스트
    learner: 학습자 관점 테스트
    educator: 교육자 관점 테스트
    boundary: 입력 검증·인증·권한 경계 테스트
    e2e: 실제 브라우저를 사용하는 E2E 테스트
    login: 로그인 화면 및 인증 흐름 테스트
    course_list: 학습과목 목록 및 상세 흐름 테스트
    auth: 인증 및 세션 검증 테스트
    integrated: 클래스 홈·학습과목·수업일정·게시판을 연결한 통합 E2E 테스트
    tc_range(start, end): 통합 E2E Journey가 담당하는 Excel TC 단계 범위
    classroom_home: 클래스 홈 위젯 API 검증 테스트
